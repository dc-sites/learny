<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bunny Stream Test - Movie Player</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 1.8rem;
    }

    h1 span {
      color: #e50914; /* Movie red accent */
    }

    /* Maintains 16:9 widescreen layout */
    .player-wrapper {
      position: relative;
      width: 100%;
      max-width: 800px;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
    }

    .player-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <h1>Movie Stream Tes.1 <span>Player</span></h1>

  <!-- Bunny Stream Embedded Player with VAST Ad Tag -->
<div style="position:relative; width:100%; padding-top:56.25%; overflow:hidden;">
  <iframe 
    src="https://videos.dyntube.com/iframes/xBfnWAy4z0KaT7gjReSucQ" 
    title="1000419050" 
    style="position:absolute; top:0; left:0; width:100%; height:100%; border:none;" 
    allow="autoplay; fullscreen" 
    allowfullscreen>
  </iframe>
</div>
<script src='//libtl.com/sdk.js' data-zone='11613100' data-sdk='show_11613100'></script>

</body>
</html>
