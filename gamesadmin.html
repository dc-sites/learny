<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Admin - Learny</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .admin-stat-card { background: var(--bg-card); padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); display: flex; align-items: center; gap: 14px; transition: all var(--transition); }
    .admin-stat-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .admin-stat-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
    .admin-stat-icon.purple { background: rgba(108,43,217,0.15); color: var(--primary-light); }
    .admin-stat-icon.green { background: rgba(16,185,129,0.15); color: var(--success); }
    .admin-stat-icon.orange { background: rgba(245,158,11,0.15); color: var(--warning); }
    .admin-stat-icon.blue { background: rgba(59,130,246,0.15); color: var(--info); }
    .admin-stat-info h3 { font-size: 22px; font-weight: 800; color: var(--text-main); margin: 0; line-height: 1; }
    .admin-stat-info p { font-size: 12px; color: var(--text-muted); margin: 0; }
    
    .admin-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    .admin-actions .btn { flex: 1; min-width: 120px; justify-content: center; }
    .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); }
    .delete-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 11px; transition: all var(--transition); }
    .delete-btn:hover { background: var(--danger); color: #fff; }

    @media (max-width: 768px) {
      .admin-stats-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .admin-stat-icon { width: 36px; height: 36px; font-size: 16px; }
      .admin-stat-info h3 { font-size: 18px; }
      .admin-stat-info p { font-size: 10px; }
      .admin-actions { flex-direction: column; }
      .admin-actions .btn { width: 100%; }
      .data-table th, .data-table td { padding: 10px 8px; font-size: 13px; white-space: nowrap; }
    }
    @media (max-width: 480px) {
      .admin-stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">L</div><div class="sidebar-title">Learny</div></div>
      <nav><ul class="nav-list">
        <li class="nav-item"><a href="index.html"><i class="fa fa-home"></i> Dashboard</a></li>
        <li class="nav-item"><a href="games.html"><i class="fa fa-gamepad"></i> Games</a></li>
        <li class="nav-item active"><a href="gameadmin.html"><i class="fa fa-shield-alt"></i> Admin</a></li>
      </ul></nav>
    </aside>

    <main class="main-content">
      <header class="page-header">
        <button class="hamburger" id="hamburger"><i class="fa fa-bars"></i></button>
        <h1 class="page-title"><i class="fa fa-shield-alt"></i> Game Admin</h1>
      </header>

      <div class="card">
        <h3 style="margin:0 0 16px;color:var(--primary-light);">📊 Live Dashboard</h3>
        <div class="admin-stats-grid">
          <div class="admin-stat-card"><div class="admin-stat-icon purple"><i class="fa fa-users"></i></div><div class="admin-stat-info"><h3 id="total-players">-</h3><p>Total Players</p></div></div>
          <div class="admin-stat-card"><div class="admin-stat-icon green"><i class="fa fa-trophy"></i></div><div class="admin-stat-info"><h3 id="finished-games">-</h3><p>Finished Games</p></div></div>
          <div class="admin-stat-card"><div class="admin-stat-icon orange"><i class="fa fa-clock"></i></div><div class="admin-stat-info"><h3 id="avg-time">-</h3><p>Avg Time</p></div></div>
          <div class="admin-stat-card"><div class="admin-stat-icon blue"><i class="fa fa-mouse-pointer"></i></div><div class="admin-stat-info"><h3 id="avg-moves">-</h3><p>Avg Moves</p></div></div>
        </div>

        <div class="table-responsive">
          <table class="data-table" id="admin-table">
            <thead><tr><th>Rank</th><th>Player</th><th>Score</th><th>Moves</th><th>Time</th><th>Date</th><th>Action</th></tr></thead>
            <tbody id="admin-tbody"><tr><td colspan="7" style="text-align:center;padding:20px;"><i class="fa fa-spinner fa-spin"></i> Loading...</td></tr></tbody>
          </table>
        </div>
        
        <div class="admin-actions">
          <button class="btn btn-primary" id="refresh-btn"><i class="fa fa-sync"></i> Refresh</button>
          <button class="btn btn-danger" id="clear-all"><i class="fa fa-trash"></i> Clear All</button>
          <button class="btn btn-secondary" id="export-csv"><i class="fa fa-file-export"></i> Export CSV</button>
        </div>
      </div>
      <footer class="site-footer">Powered by Team Ceylon</footer>
    </main>
  </div>
  <div class="overlay" id="sidebar-overlay"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, query, orderBy, onSnapshot, deleteDoc, doc, getDocs } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDyDQjhq4qkSdTiNZAORvi9KHaYMjKgwVU", authDomain: "learny-game.firebaseapp.com", projectId: "learny-game", storageBucket: "learny-game.firebasestorage.app", messagingSenderId: "21192905625", appId: "1:21192905625:web:1074315ffebf71deb03908", measurementId: "G-HS3LSWDXQT" };
    const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);

    let allData = [];

    async function load() {
      await signInAnonymously(auth);
      onSnapshot(query(collection(db, "leaderboard"), orderBy("timestamp", "desc")), snap => {
        allData = []; snap.forEach(d => allData.push({ id: d.id, ...d.data() }));
        render();
      });
    }

    function render() {
      const unique = new Set(allData.map(e => e.name?.toLowerCase())).size;
      document.getElementById('total-players').textContent = unique || '-';
      document.getElementById('finished-games').textContent = allData.length || '-';
      
      if (allData.length) {
        const totS = allData.reduce((s, e) => s + (parseInt(e.time?.split(':')[0]||0) * 60 + parseInt(e.time?.split(':')[1]||0)), 0);
        const avgS = totS / allData.length;
        document.getElementById('avg-time').textContent = `${Math.floor(avgS/60)}:${(avgS%60).toFixed(0).padStart(2,'0')}`;
        document.getElementById('avg-moves').textContent = Math.round(allData.reduce((s, e) => s + (e.moves||0), 0) / allData.length);
      } else {
        document.getElementById('avg-time').textContent = '-';
        document.getElementById('avg-moves').textContent = '-';
      }

      document.getElementById('admin-tbody').innerHTML = allData.length ? allData.map((e, i) => `
        <tr><td>${i+1}</td><td>${e.name||'Anon'}</td><td style="font-weight:700;color:var(--success)">${e.score||0}</td><td>${e.moves||0}</td><td>${e.time||'00:00'}</td><td style="font-size:11px;color:var(--text-muted);">${new Date(e.timestamp).toLocaleDateString()}</td><td><button class="delete-btn" data-id="${e.id}">Remove</button></td></tr>
      `).join('') : '<tr><td colspan="7" style="text-align:center;padding:20px;color:var(--text-muted);">No data found</td></tr>';
    }

    // Event Delegation for Delete
    document.getElementById('admin-table').addEventListener('click', async (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const id = btn.dataset.id;
      if (!confirm('Delete this entry?')) return;
      try {
        btn.disabled = true; btn.textContent = '...';
        await deleteDoc(doc(db, "leaderboard", id));
        showToast('✅ Entry deleted');
      } catch (err) { console.error(err); showToast('❌ Delete failed'); btn.disabled = false; btn.textContent = 'Remove'; }
    });

    // Clear All
    document.getElementById('clear-all').addEventListener('click', async () => {
      if (!confirm('⚠️ Delete ALL entries? This cannot be undone!')) return;
      const btn = document.getElementById('clear-all');
      btn.disabled = true; btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Clearing...';
      try {
        if (allData.length === 0) throw new Error("Empty");
        await Promise.all(allData.map(entry => deleteDoc(doc(db, "leaderboard", entry.id))));
        showToast('🗑️ All entries cleared');
      } catch (err) { console.error(err); showToast('❌ Clear failed'); }
      finally { btn.disabled = false; btn.innerHTML = '<i class="fa fa-trash"></i> Clear All'; }
    });

    document.getElementById('export-csv').onclick = () => {
      if (!allData.length) return showToast('No data');
      const csv = ['Name,Score,Moves,Time,Date', ...allData.map(e => `${e.name||''},${e.score||0},${e.moves||0},${e.time||''},${new Date(e.timestamp).toLocaleDateString()}`)];
      const blob = new Blob([csv.join('\n')], {type:'text/csv'}); const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leaderboard.csv'; a.click();
      showToast('📥 CSV downloaded');
    };
    document.getElementById('refresh-btn').onclick = load;

    document.getElementById('hamburger').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('show'); };
    document.getElementById('sidebar-overlay').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); };
    
    function showToast(m) { const t=document.getElementById('notification-toast'); if(t){t.querySelector('span').textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000);} }
    document.addEventListener('DOMContentLoaded', load);
  </script>
  <script src="script.js"></script>
</body>
</html>
