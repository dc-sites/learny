<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Admin - Learny</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .admin-container { max-width: 1000px; margin: 24px auto; padding: 24px; background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card { background: var(--bg-card-hover); border-radius: var(--radius); padding: 20px; text-align: center; border: 1px solid var(--border); }
    .stat-value { font-size: 32px; font-weight: 800; color: var(--primary-light); margin: 8px 0; }
    .stat-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; }
    .leaderboard-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 16px; }
    .leaderboard-table th { text-align: left; padding: 12px 8px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; }
    .leaderboard-table td { padding: 12px 8px; border-bottom: 1px solid var(--border); }
    .leaderboard-table tr:hover { background: var(--bg-card-hover); }
    .leaderboard-table .rank { font-weight: 800; width: 40px; text-align: center; }
    .leaderboard-table .rank-1 { color: #ffd700; }
    .delete-btn { background: var(--danger); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .delete-btn:hover { opacity: 0.8; }
    .admin-filters { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .admin-filters input, .admin-filters select { padding: 10px; background: var(--bg-dark); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-main); }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
    .loading i { animation: spin 1s linear infinite; color: var(--primary); font-size: 24px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="app-container">
    <button class="hamburger" id="hamburger"><i class="fa fa-bars"></i></button>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="sidebar-logo">L</div><div class="sidebar-title">Learny</div></div>
      <nav><ul class="nav-list">
        <li class="nav-item"><a href="index.html"><i class="fa fa-home"></i> Dashboard</a></li>
        <li class="nav-item"><a href="games.html"><i class="fa fa-gamepad"></i> Games</a></li>
        <li class="nav-item active"><a href="gameadmin.html"><i class="fa fa-shield-alt"></i> Admin</a></li>
      </ul></nav>
    </aside>
    <main class="main-content">
      <header class="page-header"><h1 class="page-title"><i class="fa fa-shield-alt"></i> Game Admin</h1></header>
      <div class="admin-container">
        <h2 style="margin-bottom:24px;color:var(--primary-light);text-align:center;">🎮 Admin Dashboard</h2>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-value" id="total-players">-</div><div class="stat-label">Total Players</div></div>
          <div class="stat-card"><div class="stat-value" id="finished-games">-</div><div class="stat-label">Finished Games</div></div>
          <div class="stat-card"><div class="stat-value" id="avg-time">-</div><div class="stat-label">Avg Time</div></div>
          <div class="stat-card"><div class="stat-value" id="avg-moves">-</div><div class="stat-label">Avg Moves</div></div>
        </div>        <div class="admin-filters">
          <input type="text" id="search-input" placeholder="🔍 Search player..." style="flex:1;">
          <select id="sort-select" style="min-width:150px;">
            <option value="score-desc">Score (High → Low)</option>
            <option value="score-asc">Score (Low → High)</option>
            <option value="moves-asc">Moves (Fewest)</option>
            <option value="date-desc">Date (Newest)</option>
          </select>
        </div>
        <div class="table-responsive">
          <table class="leaderboard-table">
            <thead><tr><th class="rank">#</th><th>Player</th><th>Score</th><th>Moves</th><th>Time</th><th>Date</th><th>Action</th></tr></thead>
            <tbody id="admin-table-body"><tr><td colspan="7" class="loading"><i class="fa fa-spinner"></i> Loading...</td></tr></tbody>
          </table>
        </div>
        <div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;">
          <button class="btn btn-secondary" onclick="location.reload()"><i class="fa fa-sync"></i> Refresh</button>
          <button class="btn btn-danger" id="clear-all"><i class="fa fa-trash"></i> Clear All</button>
          <button class="btn btn-primary" id="export-csv"><i class="fa fa-file-csv"></i> Export CSV</button>
          <button class="btn btn-secondary" onclick="window.location.href='games.html'"><i class="fa fa-arrow-left"></i> Back</button>
        </div>
      </div>
      <footer class="site-footer">Powered by Team Ceylon | Made in Sri Lanka 🇱🇰</footer>
    </main>
  </div>
  <div class="overlay" id="sidebar-overlay"></div>
  <div class="notification" id="notification-toast"><i class="fa fa-check-circle"></i><span>Msg</span></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";
    import { getFirestore, collection, getDocs, query, orderBy, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

    const firebaseConfig = { apiKey: "AIzaSyDyDQjhq4qkSdTiNZAORvi9KHaYMjKgwVU", authDomain: "learny-game.firebaseapp.com", projectId: "learny-game", storageBucket: "learny-game.firebasestorage.app", messagingSenderId: "21192905625", appId: "1:21192905625:web:1074315ffebf71deb03908", measurementId: "G-HS3LSWDXQT" };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app); const auth = getAuth(app);

    let allData = [];

    async function loadData() {
      await signInAnonymously(auth);
      onSnapshot(query(collection(db, "leaderboard"), orderBy("timestamp", "desc")), (snap) => {
        allData = []; snap.forEach(d => { const dt=d.data(); allData.push({id:d.id, name:dt.name, score:dt.score, moves:dt.moves, time:dt.time, date:dt.date?.toDate?.()||new Date(dt.timestamp), timestamp:dt.timestamp}); });
        renderAll();
      });
    }

    function renderAll() {
      const search = document.getElementById('search-input').value.toLowerCase();
      const sort = document.getElementById('sort-select').value;      let filtered = allData.filter(e => e.name.toLowerCase().includes(search));
      
      filtered.sort((a,b) => {
        if(sort==='score-desc') return b.score-a.score || a.moves-b.moves;
        if(sort==='score-asc') return a.score-b.score || b.moves-a.moves;
        if(sort==='moves-asc') return a.moves-b.moves;
        return (b.timestamp||0)-(a.timestamp||0);
      });

      const unique = new Set(filtered.map(e => e.name.toLowerCase())).size;
      document.getElementById('total-players').textContent = unique;
      document.getElementById('finished-games').textContent = filtered.length;
      
      if(filtered.length) {
        const totS = filtered.reduce((s,e) => s + (parseInt(e.time.split(':')[0])*60 + parseInt(e.time.split(':')[1])), 0);
        const avgS = totS / filtered.length;
        document.getElementById('avg-time').textContent = `${Math.floor(avgS/60)}:${(avgS%60).toFixed(0).padStart(2,'0')}`;
        document.getElementById('avg-moves').textContent = Math.round(filtered.reduce((s,e)=>s+e.moves,0)/filtered.length);
      }

      document.getElementById('admin-table-body').innerHTML = filtered.map((e,i) => {
        const rCls = i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';
        const dStr = e.date instanceof Date ? e.date.toLocaleString() : 'N/A';
        return `<tr><td class="rank ${rCls}">#${i+1}</td><td>${e.name}</td><td style="font-weight:700;color:var(--success)">${e.score}</td><td>${e.moves}</td><td>${e.time}</td><td style="font-size:11px;color:var(--text-muted)">${dStr}</td><td><button class="delete-btn" data-id="${e.id}">Remove</button></td></tr>`;
      }).join('');

      document.querySelectorAll('.delete-btn').forEach(b => b.onclick = () => {
        if(confirm('Delete this entry?')) deleteDoc(doc(db, "leaderboard", b.dataset.id));
      });
    }

    document.getElementById('search-input').oninput = renderAll;
    document.getElementById('sort-select').onchange = renderAll;
    document.getElementById('clear-all').onclick = async () => { if(confirm('Clear ALL data?')) { await Promise.all(allData.map(e => deleteDoc(doc(db, "leaderboard", e.id)))); showToast('Cleared'); } };
    document.getElementById('export-csv').onclick = () => {
      const csv = ['Rank,Name,Score,Moves,Time,Date', ...allData.map((e,i)=>`${i+1},"${e.name}",${e.score},${e.moves},${e.time},"${e.date.toLocaleString()}"`)];
      const blob = new Blob([csv.join('\n')], {type:'text/csv'}); const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='leaderboard.csv'; a.click();
    };

    document.getElementById('hamburger').onclick = () => { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebar-overlay').classList.toggle('show'); };
    document.getElementById('sidebar-overlay').onclick = () => { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-overlay').classList.remove('show'); };
    function showToast(m) { const t=document.getElementById('notification-toast'); t.querySelector('span').textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 3000); }
    
    document.addEventListener('DOMContentLoaded', loadData);
  </script>
  <script src="script.js"></script>
</body>
</html>
