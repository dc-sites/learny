<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Learny - Virtual Study Room</title>
  
  <!-- Core App Styles & Icons -->
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* ========================================
       ZOOM-STYLE STUDY ROOM LAYOUT
       ======================================== */
    .zoom-layout {
      display: flex;
      height: calc(100vh - 140px);
      background: var(--bg-dark);
      border-radius: var(--radius);
      overflow: hidden;
      border: 1px solid var(--border);
      margin-bottom: 20px;
    }

    .zoom-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      min-width: 0;
    }

    .video-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      padding: 15px;
      overflow-y: auto;
      align-content: start;
    }

    .video-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      aspect-ratio: 16/9;
      border: 2px solid var(--border);
      transition: border-color 0.3s;
    }

    .video-card:hover { border-color: var(--primary); }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    
    .video-avatar-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      background: var(--bg-card);
    }

    .video-card.cam-off video { display: none; }
    .video-card.cam-off .video-avatar-fallback { display: block; }

    .video-label {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.7);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #fff;
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zoom-bottom-bar {
      height: 80px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 15px;
    }

    .controls-group, .end-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .zoom-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-dark);
      border: 1px solid var(--border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 1.1rem;
    }

    .zoom-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .zoom-btn.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
    .zoom-btn.btn-danger:hover { background: #b91c1c; }
    .zoom-btn.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
    .zoom-btn.active-off { background: var(--danger); color: #fff; border-color: var(--danger); }

    .room-sidebar {
      width: 320px;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border); }
    
    .sidebar-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }
    
    .sidebar-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    
    .sidebar-panel { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .sidebar-panel.active { display: flex; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      background: var(--bg-dark);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      border: 1px solid var(--border);
    }

    .chat-msg strong { color: var(--primary-light); margin-right: 6px; }

    .chat-input-group {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .chat-input-group input { flex: 1; }
    
    .chat-status {
      padding: 8px 15px;
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      border-top: 1px solid var(--border);
    }

    /* Circular Timer */
    .timer-circle-container {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer-bg { fill: none; stroke: var(--border); stroke-width: 6; }
    .timer-progress { fill: none; stroke: var(--primary); stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
    
    .timer-text {
      position: absolute;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
      line-height: 1;
      font-family: monospace;
    }

    #phase-badge {
      font-size: 0.6rem;
      display: block;
      margin-top: 2px;
      padding: 2px 4px;
      border-radius: 4px;
      background: var(--primary);
      color: #fff;
      text-transform: uppercase;
    }
    
    #phase-badge.BREAK { background: var(--success); }
    #phase-badge.WAITING { background: var(--warning); color: #000; }
    #phase-badge.ENDED { background: var(--danger); }

    .user-tag {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .kick-btn {
      padding: 4px 8px;
      font-size: 0.75rem;
      border-radius: 6px;
      background: var(--danger);
      color: #fff;
      border: none;
      cursor: pointer;
    }

    /* Setup Tabs */
    .setup-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .setup-tab {
      padding: 10px 20px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-weight: 600;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      font-size: 1rem;
    }

    .setup-tab.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* Responsive */
    @media (max-width: 768px) {
      .zoom-layout { flex-direction: column; height: auto; min-height: calc(100vh - 140px); }
      .room-sidebar { width: 100%; max-height: 400px; border-left: none; border-top: 1px solid var(--border); }
      .zoom-bottom-bar { height: auto; padding: 10px; flex-wrap: wrap; justify-content: center; }
      .video-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; padding: 10px; }
      .d-md-none { display: flex !important; }
    }
    
    @media (min-width: 769px) {
      .d-md-none { display: none !important; }
    }
  </style>
</head>

<!-- Room Logic (Firebase & WebRTC) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { 
    getDatabase, ref, set, update, remove, onValue, onChildAdded, push, onDisconnect, get 
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgPaCkohoVx6rXHAbQhk80R3EvncVkxx4",
    authDomain: "rooms-7a301.firebaseapp.com",
    databaseURL: "https://rooms-7a301-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "rooms-7a301",
    storageBucket: "rooms-7a301.firebasestorage.app",
    messagingSenderId: "588497268013",
    appId: "1:588497268013:web:51de1add5257a368f781a4"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Load Profile Data from Learny App
  const savedData = localStorage.getItem('learny_data');
  let profile = { name: 'User', avatar: 'https://i.postimg.cc/QdPYLqrV/AIRetouch-20260412-135002012.png' };
  if (savedData) {
    try {
      const parsed = JSON.parse(savedData);
      if (parsed.profile) {
        profile.name = parsed.profile.name || 'User';
        profile.avatar = parsed.profile.avatar || profile.avatar;
      }
    } catch(e) {}
  }

  let currentRoomId = localStorage.getItem("learny_room_id") || "";
  let userName = profile.name;
  let userId = localStorage.getItem("learny_user_id");
  if (!userId) {
    userId = "usr_" + Math.random().toString(36).substr(2, 6);
    localStorage.setItem("learny_user_id", userId);
  }

  let isHost = false;
  let timerInterval = null;
  let tickSoundEnabled = false;
  let chatMutedByHost = false;
  let audioCtx = null;

  let localStream = null;
  const peerConnections = {};
  const iceCandidatesQueue = {};

  const iceServers = {
    iceServers: [
      { urls: "stun:stun.l.google.com:19302" },
      { urls: "stun:stun1.l.google.com:19302" },
      { urls: "turn:openrelay.metered.ca:80", username: "openrelayproject", credential: "openrelayproject" },
      { urls: "turn:openrelay.metered.ca:443", username: "openrelayproject", credential: "openrelayproject" }
    ]
  };

  async function startLocalMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    } catch (err) {
      console.warn("Camera/Mic access declined or unavailable:", err);
      localStream = new MediaStream();
    }
    addVideoCard(userId, userName, localStream, true, profile.avatar);
    if (localStream.getVideoTracks()[0] && localStream.getVideoTracks()[0].enabled) {
        document.getElementById(`vcard-${userId}`).classList.remove('cam-off');
    }
  }

  function addVideoCard(id, label, stream, isMuted = false, avatarUrl = null) {
    let card = document.getElementById(`vcard-${id}`);
    if (!card) {
      card = document.createElement("div");
      card.id = `vcard-${id}`;
      card.className = "video-card cam-off"; // Default to avatar until video track confirmed
      
      const videoEl = document.createElement("video");
      videoEl.id = `vvid-${id}`;
      videoEl.autoplay = true;
      videoEl.playsInline = true;
      videoEl.muted = isMuted;
      
      const avatarEl = document.createElement("img");
      avatarEl.className = "video-avatar-fallback";
      avatarEl.src = avatarUrl || 'https://i.postimg.cc/QdPYLqrV/AIRetouch-20260412-135002012.png';
      
      const labelEl = document.createElement("div");
      labelEl.className = "video-label";
      labelEl.innerHTML = `${label} ${isMuted ? '<i class="fa fa-user-shield" style="color:var(--warning)"></i>' : ''}`;
      
      card.appendChild(videoEl);
      card.appendChild(avatarEl);
      card.appendChild(labelEl);
      document.getElementById("video-grid").appendChild(card);
    }

    if (stream) {
        const videoElem = document.getElementById(`vvid-${id}`);
        if (videoElem && videoElem.srcObject !== stream) {
            videoElem.srcObject = stream;
            videoElem.play().catch(e => {
                if (!isMuted) {
                    videoElem.muted = true;
                    videoElem.play().catch(err => console.error(err));
                }
            });
        }
    }
  }

  function removeVideoCard(id) {
    const card = document.getElementById(`vcard-${id}`);
    if (card) card.remove();
    if (peerConnections[id]) {
      peerConnections[id].close();
      delete peerConnections[id];
      delete iceCandidatesQueue[id];
    }
  }

  function createPeerConnection(remoteUserId, remoteUserName, isInitiator) {
    if (peerConnections[remoteUserId]) return peerConnections[remoteUserId];

    const pc = new RTCPeerConnection(iceServers);
    peerConnections[remoteUserId] = pc;
    iceCandidatesQueue[remoteUserId] = [];

    if (localStream) {
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
    }

    pc.ontrack = (event) => {
      const remoteStream = event.streams[0] || new MediaStream([event.track]);
      const videoElem = document.getElementById(`vvid-${remoteUserId}`);
      if (videoElem) {
         videoElem.srcObject = remoteStream;
         videoElem.play().catch(e => console.warn(e));
         if (event.track.kind === 'video' && event.track.enabled) {
             document.getElementById(`vcard-${remoteUserId}`).classList.remove('cam-off');
         }
      }
    };

    pc.onicecandidate = (event) => {
      if (event.candidate) {
        push(ref(db, `rooms/${currentRoomId}/signal/${remoteUserId}/${userId}/candidates`), event.candidate.toJSON());
      }
    };

    if (isInitiator) {
      pc.createOffer({ offerToReceiveVideo: true, offerToReceiveAudio: true })
        .then(offer => pc.setLocalDescription(offer))
        .then(() => {
          set(ref(db, `rooms/${currentRoomId}/signal/${remoteUserId}/${userId}/offer`), {
            type: pc.localDescription.type,
            sdp: pc.localDescription.sdp,
            senderName: userName
          });
        }).catch(e => console.error("Offer Error:", e));
    }

    return pc;
  }

  function processBufferedCandidates(remoteUserId) {
    const pc = peerConnections[remoteUserId];
    const queue = iceCandidatesQueue[remoteUserId];
    if (pc && queue && pc.remoteDescription) {
      while (queue.length > 0) {
        const cand = queue.shift();
        pc.addIceCandidate(new RTCIceCandidate(cand)).catch(e => console.error(e));
      }
    }
  }

  function listenForWebRTCSignals() {
    const signalRef = ref(db, `rooms/${currentRoomId}/signal/${userId}`);
    
    onChildAdded(signalRef, (snapshot) => {
      const senderId = snapshot.key;
      const dataRef = ref(db, `rooms/${currentRoomId}/signal/${userId}/${senderId}`);

      onValue(dataRef, (dataSnap) => {
        const data = dataSnap.val();
        if (!data) return;

        if (data.offer) {
          const pc = createPeerConnection(senderId, data.offer.senderName || "Student", false);
          if (pc.signalingState === "stable" || pc.signalingState === "have-remote-offer") {
            pc.setRemoteDescription(new RTCSessionDescription(data.offer))
              .then(() => {
                processBufferedCandidates(senderId);
                return pc.createAnswer();
              })
              .then(answer => pc.setLocalDescription(answer))
              .then(() => {
                set(ref(db, `rooms/${currentRoomId}/signal/${senderId}/${userId}/answer`), {
                  type: pc.localDescription.type,
                  sdp: pc.localDescription.sdp
                });
              }).catch(e => console.error("Answer Error:", e));
          }
        }

        if (data.answer && peerConnections[senderId]) {
          const pc = peerConnections[senderId];
          if (pc.signalingState === "have-local-offer") {
            pc.setRemoteDescription(new RTCSessionDescription(data.answer))
              .then(() => processBufferedCandidates(senderId))
              .catch(e => console.error("Remote Desc Error:", e));
          }
        }
      });

      onChildAdded(ref(db, `rooms/${currentRoomId}/signal/${userId}/${senderId}/candidates`), (candSnap) => {
        const cand = candSnap.val();
        const pc = peerConnections[senderId];
        if (cand) {
          if (pc && pc.remoteDescription) {
            pc.addIceCandidate(new RTCIceCandidate(cand)).catch(e => console.error(e));
          } else {
            if (!iceCandidatesQueue[senderId]) iceCandidatesQueue[senderId] = [];
            iceCandidatesQueue[senderId].push(cand);
          }
        }
      });
    });
  }

  function playTickSound() {
    if (!tickSoundEnabled) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    } catch (e) { console.error(e); }
  }

  function validateUserName() {
    const input = document.getElementById("user-name").value.trim();
    if (!input) {
      alert("Please enter your name before creating or joining a room!");
      return null;
    }
    userName = input;
    localStorage.setItem("learny_user_name", userName);
    return userName;
  }

  function generateRoomId(name) {
    const code = Math.random().toString(36).substring(2, 6);
    const prefix = (name || "room").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 4);
    return `${prefix}-${code}`;
  }

  window.addEventListener("DOMContentLoaded", () => {
    document.getElementById("user-name").value = userName;
    
    const urlParams = new URLSearchParams(window.location.search);
    const roomIdFromUrl = urlParams.get("room");
    if (roomIdFromUrl) {
      document.getElementById("join-room-id").value = roomIdFromUrl;
      document.querySelector('.setup-tab[data-tab="join"]').click();
    }

    if (currentRoomId && userName) {
      get(ref(db, `rooms/${currentRoomId}`)).then((snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.status !== "ENDED") {
              isHost = (data.hostId === userId);
              enterRoom(currentRoomId);
          } else {
              localStorage.removeItem("learny_room_id");
          }
        } else {
          localStorage.removeItem("learny_room_id");
        }
      });
    }

    // Setup Tabs Logic
    document.querySelectorAll('.setup-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.setup-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('create-panel').classList.toggle('hidden', tab.dataset.tab !== 'create');
        document.getElementById('join-panel').classList.toggle('hidden', tab.dataset.tab !== 'join');
      });
    });

    // Sidebar Tabs Logic
    document.querySelectorAll('.sidebar-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.sidebar-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.target).classList.add('active');
      });
    });
  });

  document.getElementById("btn-create").addEventListener("click", () => {
    if (!validateUserName()) return;

    const roomName = document.getElementById("new-room-name").value || "Study Room";
    const maxStudents = parseInt(document.getElementById("max-students").value) || 4;
    const focusMins = parseInt(document.getElementById("focus-mins").value) || 25;
    const breakMins = parseInt(document.getElementById("break-mins").value) || 5;

    currentRoomId = generateRoomId(roomName);
    isHost = true;

    localStorage.setItem("learny_room_id", currentRoomId);
    enterRoom(currentRoomId);

    set(ref(db, "rooms/" + currentRoomId), {
      roomName,
      maxStudents,
      focusMins,
      breakMins,
      hostId: userId,
      status: "WAITING",
      endTime: 0,
      chatMuted: false
    });
  });

  document.getElementById("btn-join").addEventListener("click", () => {
    if (!validateUserName()) return;

    const roomId = document.getElementById("join-room-id").value.trim();
    if (!roomId) return;

    get(ref(db, `rooms/${roomId}`)).then((snapshot) => {
      if (!snapshot.exists()) {
        alert("Room not found!");
        return;
      }
      const data = snapshot.val();
      if (data.status === "ENDED") {
          alert("This meeting has ended.");
          return;
      }
      const currentUsersCount = data.users ? Object.keys(data.users).length : 0;

      if (currentUsersCount >= data.maxStudents && !data.users[userId]) {
        alert(`Room is full! (Max Limit: ${data.maxStudents} students)`);
        return;
      }

      currentRoomId = roomId;
      isHost = (data.hostId === userId);
      localStorage.setItem("learny_room_id", currentRoomId);
      enterRoom(currentRoomId);
    });
  });

  document.getElementById("btn-leave").addEventListener("click", leaveRoom);

  function leaveRoom() {
    if (localStream) {
      localStream.getTracks().forEach(t => t.stop());
    }
    if (currentRoomId && userId) {
      remove(ref(db, `rooms/${currentRoomId}/users/${userId}`));
      remove(ref(db, `rooms/${currentRoomId}/signal/${userId}`));
    }
    localStorage.removeItem("learny_room_id");
    location.reload();
  }

  async function enterRoom(roomId) {
    document.getElementById("setup-section").classList.add("hidden");
    document.getElementById("room-section").classList.remove("hidden");

    await startLocalMedia();
    listenForWebRTCSignals();

    const userRef = ref(db, `rooms/${roomId}/users/${userId}`);
    set(userRef, { name: userName, isHost, avatar: profile.avatar, camOff: false, micOff: false });
    onDisconnect(userRef).remove();
    onDisconnect(ref(db, `rooms/${roomId}/signal/${userId}`)).remove();

    if (isHost) {
      document.getElementById("btn-start-session").classList.remove("hidden");
      document.getElementById("btn-end-meeting").classList.remove("hidden");
      document.getElementById("btn-toggle-mute-chat").classList.remove("hidden");
    }

    const circle = document.querySelector('.timer-progress');
    const radius = 45;
    const circumference = 2 * Math.PI * radius;
    circle.style.strokeDasharray = circumference;
    circle.style.strokeDashoffset = circumference;

    onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        alert("Room has been closed by host.");
        leaveRoom();
        return;
      }

      if (data.status === "ENDED") {
        alert("The host has ended the meeting.");
        leaveRoom();
        return;
      }

      if (data.users && !data.users[userId]) {
        alert("You have been removed from the room by the Host.");
        leaveRoom();
        return;
      }

      document.title = `${data.roomName} - Learny`;
      chatMutedByHost = !!data.chatMuted;

      const muteBtn = document.getElementById("btn-toggle-mute-chat");
      if (chatMutedByHost) {
          muteBtn.innerHTML = `<i class="fa fa-comment-slash"></i>`;
          muteBtn.classList.add('active-off');
      } else {
          muteBtn.innerHTML = `<i class="fa fa-comment"></i>`;
          muteBtn.classList.remove('active-off');
      }

      if (isHost && data.status === "WAITING") {
        document.getElementById("btn-start-session").classList.remove("hidden");
      } else {
        document.getElementById("btn-start-session").classList.add("hidden");
      }

      updatePhase(data.status, data.endTime, data.focusMins, data.breakMins);
    });

    onValue(ref(db, `rooms/${roomId}/users`), (snapshot) => {
      const users = snapshot.val() || {};
      const userEntries = Object.entries(users);
      document.getElementById("user-count").innerText = userEntries.length;

      userEntries.forEach(([remoteId, u]) => {
        if (remoteId !== userId && !peerConnections[remoteId]) {
          addVideoCard(remoteId, u.name, null, false, u.avatar);
          const isInitiator = userId < remoteId;
          createPeerConnection(remoteId, u.name, isInitiator);
        }
        
        // Sync media states
        const card = document.getElementById(`vcard-${remoteId}`);
        if (card) {
            if (u.camOff) card.classList.add('cam-off');
            else card.classList.remove('cam-off');
        }
      });

      Object.keys(peerConnections).forEach(pId => {
        if (!users[pId]) removeVideoCard(pId);
      });

      const userList = document.getElementById("user-list");
      userList.innerHTML = userEntries
        .map(([id, u]) => `
          <div class="user-tag">
            <span>
              <i class="fa fa-user-graduate"></i> ${u.name} 
              ${u.isHost ? '<span class="badge" style="font-size:0.6rem; padding:2px 6px; background:var(--warning); color:#000; margin-left:5px;">HOST</span>' : ''}
              ${u.micOff ? '<i class="fa fa-microphone-slash" style="color:var(--danger); margin-left:6px;"></i>' : ''}
            </span>
            ${isHost && id !== userId ? `<button class="kick-btn" onclick="window.kickUser('${id}')"><i class="fa fa-user-slash"></i></button>` : ''}
          </div>
        `).join("");
    });

    onChildAdded(ref(db, `rooms/${roomId}/messages`), (snapshot) => {
      const msg = snapshot.val();
      const box = document.getElementById("chat-box");
      box.innerHTML += `<div class="chat-msg"><strong>${msg.sender}:</strong> ${msg.text}</div>`;
      box.scrollTop = box.scrollHeight;
    });
  }

  document.getElementById("btn-toggle-mic").addEventListener("click", () => {
    if (!localStream) return;
    const audioTrack = localStream.getAudioTracks()[0];
    if (audioTrack) {
      audioTrack.enabled = !audioTrack.enabled;
      const btn = document.getElementById("btn-toggle-mic");
      if (audioTrack.enabled) {
          btn.innerHTML = `<i class="fa fa-microphone"></i>`;
          btn.classList.remove('active-off');
      } else {
          btn.innerHTML = `<i class="fa fa-microphone-slash"></i>`;
          btn.classList.add('active-off');
      }
      update(ref(db, `rooms/${currentRoomId}/users/${userId}`), { micOff: !audioTrack.enabled });
    }
  });

  document.getElementById("btn-toggle-cam").addEventListener("click", () => {
    if (!localStream) return;
    const videoTrack = localStream.getVideoTracks()[0];
    if (videoTrack) {
      videoTrack.enabled = !videoTrack.enabled;
      const btn = document.getElementById("btn-toggle-cam");
      const card = document.getElementById(`vcard-${userId}`);
      if (videoTrack.enabled) {
        btn.innerHTML = `<i class="fa fa-video"></i>`;
        btn.classList.remove('active-off');
        card.classList.remove('cam-off');
      } else {
        btn.innerHTML = `<i class="fa fa-video-slash"></i>`;
        btn.classList.add('active-off');
        card.classList.add('cam-off');
      }
      update(ref(db, `rooms/${currentRoomId}/users/${userId}`), { camOff: !videoTrack.enabled });
    }
  });

  window.kickUser = function(targetUserId) {
    if (confirm("Remove this student from the room?")) {
      remove(ref(db, `rooms/${currentRoomId}/users/${targetUserId}`));
    }
  };

  document.getElementById("btn-toggle-tick").addEventListener("click", () => {
    tickSoundEnabled = !tickSoundEnabled;
    const btn = document.getElementById("btn-toggle-tick");
    if (tickSoundEnabled) {
      btn.innerHTML = `<i class="fa fa-volume-up"></i>`;
      btn.classList.add('active-off');
    } else {
      btn.innerHTML = `<i class="fa fa-volume-mute"></i>`;
      btn.classList.remove('active-off');
    }
  });

  document.getElementById("btn-toggle-mute-chat").addEventListener("click", () => {
    update(ref(db, `rooms/${currentRoomId}`), { chatMuted: !chatMutedByHost });
  });

  document.getElementById("btn-end-meeting").addEventListener("click", () => {
    if (confirm("End meeting for all participants?")) {
      update(ref(db, `rooms/${currentRoomId}`), { status: "ENDED" });
    }
  });

  document.getElementById("btn-start-session").addEventListener("click", () => {
    get(ref(db, `rooms/${currentRoomId}`)).then((snapshot) => {
      const data = snapshot.val();
      const endTime = Date.now() + data.focusMins * 60 * 1000;

      update(ref(db, `rooms/${currentRoomId}`), {
        status: "FOCUS",
        endTime
      });
    });
  });

  function updatePhase(status, endTime, focusMins, breakMins) {
    const badge = document.getElementById("phase-badge");
    const chatInput = document.getElementById("chat-input");
    const sendBtn = document.getElementById("send-btn");
    const statusMsg = document.getElementById("chat-status-msg");
    const circle = document.querySelector('.timer-progress');
    const circumference = 2 * Math.PI * 45;

    if (status === "WAITING") {
      badge.innerText = "LOBBY";
      badge.className = "badge WAITING";
      statusMsg.innerHTML = `<i class="fa fa-hourglass-half"></i> ${isHost ? "Click 'Start' when ready." : "Waiting for host..."}`;
      chatInput.disabled = true;
      sendBtn.disabled = true;
      document.getElementById("timer-display").innerText = `${String(focusMins).padStart(2, '0')}:00`;
      circle.style.strokeDashoffset = circumference;
      if (timerInterval) clearInterval(timerInterval);
      return;
    }

    badge.innerText = status === "FOCUS" ? "FOCUS" : "BREAK";
    badge.className = `badge ${status}`;

    const isFocus = status === "FOCUS";
    const canChat = !isFocus && !chatMutedByHost;

    chatInput.disabled = !canChat;
    sendBtn.disabled = !canChat;

    if (isFocus) {
      statusMsg.innerHTML = `<i class="fa fa-lock"></i> Chat locked during Focus mode.`;
    } else if (chatMutedByHost) {
      statusMsg.innerHTML = `<i class="fa fa-ban"></i> Chat restricted by Host.`;
    } else {
      statusMsg.innerHTML = `<i class="fa fa-lock-open"></i> Break time! Chat is open.`;
    }

    if (timerInterval) clearInterval(timerInterval);

    let totalSecs = (status === "FOCUS" ? focusMins : breakMins) * 60;

    timerInterval = setInterval(() => {
      const remainingSecs = Math.max(0, Math.floor((endTime - Date.now()) / 1000));
      
      playTickSound();

      if (remainingSecs === 0 && isHost) {
        clearInterval(timerInterval);
        toggleRoomPhase(status, focusMins, breakMins);
      }

      const progress = totalSecs > 0 ? remainingSecs / totalSecs : 0;
      circle.style.strokeDashoffset = circumference * (1 - progress);

      const mins = String(Math.floor(remainingSecs / 60)).padStart(2, '0');
      const secs = String(remainingSecs % 60).padStart(2, '0');
      document.getElementById("timer-display").innerText = `${mins}:${secs}`;
    }, 1000);
  }

  function toggleRoomPhase(currentStatus, focusMins, breakMins) {
    const nextStatus = currentStatus === "FOCUS" ? "BREAK" : "FOCUS";
    const nextDuration = nextStatus === "FOCUS" ? focusMins : breakMins;
    
    update(ref(db, `rooms/${currentRoomId}`), {
      status: nextStatus,
      endTime: Date.now() + nextDuration * 60 * 1000
    });
  }

  document.getElementById("send-btn").addEventListener("click", sendMessage);
  document.getElementById("chat-input").addEventListener("keypress", (e) => {
      if (e.key === "Enter") sendMessage();
  });

  function sendMessage() {
    const input = document.getElementById("chat-input");
    if (input.value.trim() && !chatMutedByHost) {
      push(ref(db, `rooms/${currentRoomId}/messages`), {
        sender: userName,
        text: input.value
      });
      input.value = "";
    }
  }
  
  // Mobile Sidebar Toggle
  document.getElementById("btn-toggle-room-sidebar").addEventListener("click", () => {
      document.getElementById("room-sidebar").classList.toggle("hidden");
  });
</script>
</body>
</html>
